name: Nightly Tests

on:
  workflow_dispatch: # Manual triggering only (nightly schedule removed)

jobs:
  # =============================================================================
  # Comprehensive ML Feature Tests
  # =============================================================================
  ml-feature-tests:
    name: ML Feature Tests (Comprehensive)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r services/storage-service/requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run ML feature tests with detailed markers
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          TESTING: true
        run: |
          pytest tests/unit/ml_features/ -v -m ml --cov --cov-report=html

      - name: Run slow/integration tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          TESTING: true
        run: |
          pytest tests/integration/ -v -m "slow or integration" --cov-append

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-test-results
          path: |
            htmlcov/
            coverage.xml

  # =============================================================================
  # Performance & Load Tests
  # =============================================================================
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r services/storage-service/requirements.txt
          pip install locust pytest-benchmark

      - name: Run performance benchmarks
        run: |
          pytest tests/performance/ -v --benchmark-only

  # =============================================================================
  # Security Scanning
  # =============================================================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Bandit security linter
        run: |
          pip install bandit
          bandit -r services/storage-service/app/ -f json -o bandit-report.json

      - name: Archive security results
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            trivy-results.sarif
            bandit-report.json
