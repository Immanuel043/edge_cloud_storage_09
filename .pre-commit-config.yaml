# =============================================================================
# Pre-commit Hooks Configuration
# =============================================================================
# Install: pre-commit install
# Run manually: pre-commit run --all-files
# Update hooks: pre-commit autoupdate
# =============================================================================

repos:
  # ---------------------------------------------------------------------------
  # General File Checks
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # Allow custom YAML tags
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]  # Max 1MB files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # ---------------------------------------------------------------------------
  # Python Code Formatting
  # ---------------------------------------------------------------------------
  - repo: https://github.com/psf/black
    rev: 23.11.0
    hooks:
      - id: black
        language_version: python3.11
        args: [--line-length=100]

  # ---------------------------------------------------------------------------
  # Python Import Sorting
  # ---------------------------------------------------------------------------
  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]

  # ---------------------------------------------------------------------------
  # Python Linting
  # ---------------------------------------------------------------------------
  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args:
          - --max-line-length=100
          - --ignore=E203,E266,E501,W503
          - --max-complexity=10
          - --exclude=__pycache__,*.pyc,.git,venv,env
        additional_dependencies:
          - flake8-bugbear
          - flake8-comprehensions
          - flake8-simplify

  # ---------------------------------------------------------------------------
  # Python Type Checking
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies:
          - types-redis
          - types-requests
          - types-PyYAML

  # ---------------------------------------------------------------------------
  # Security Scanning
  # ---------------------------------------------------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: [-r, services/storage-service/app/, -ll]
        exclude: tests/

  # ---------------------------------------------------------------------------
  # Secret Detection
  # ---------------------------------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: package-lock.json

  # ---------------------------------------------------------------------------
  # Markdown Linting
  # ---------------------------------------------------------------------------
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.37.0
    hooks:
      - id: markdownlint
        args: [--fix, --disable, MD013, MD033, MD041]

  # ---------------------------------------------------------------------------
  # YAML Linting
  # ---------------------------------------------------------------------------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yml]

  # ---------------------------------------------------------------------------
  # Docker
  # ---------------------------------------------------------------------------
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.1-beta
    hooks:
      - id: hadolint-docker
        args: [--ignore, DL3008, --ignore, DL3013]

  # ---------------------------------------------------------------------------
  # Commit Message Validation
  # ---------------------------------------------------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict]

# =============================================================================
# Configuration Files Required
# =============================================================================
# Create these files in project root:
#
# .flake8:
# [flake8]
# max-line-length = 100
# extend-ignore = E203, E266, E501, W503
# max-complexity = 10
# exclude = __pycache__, *.pyc, .git, venv, env, node_modules
#
# .yamllint.yml:
# extends: default
# rules:
#   line-length:
#     max: 120
#   document-start: disable
#   truthy:
#     check-keys: false
#
# pyproject.toml:
# [tool.black]
# line-length = 100
# target-version = ['py311']
#
# [tool.isort]
# profile = "black"
# line_length = 100
#
# [tool.mypy]
# python_version = "3.11"
# ignore_missing_imports = true
# =============================================================================

# =============================================================================
# Usage Instructions
# =============================================================================
#
# 1. Install pre-commit:
#    pip install pre-commit
#
# 2. Install the git hooks:
#    pre-commit install
#    pre-commit install --hook-type commit-msg
#
# 3. Run on all files (first time):
#    pre-commit run --all-files
#
# 4. Update hooks to latest versions:
#    pre-commit autoupdate
#
# 5. Skip hooks for a commit (use sparingly):
#    git commit --no-verify -m "commit message"
#
# 6. Run specific hook:
#    pre-commit run black --all-files
#
# =============================================================================
# Conventional Commit Format
# =============================================================================
#
# <type>(<scope>): <subject>
#
# Types:
#   feat:     New feature
#   fix:      Bug fix
#   docs:     Documentation changes
#   style:    Code style (formatting, no logic change)
#   refactor: Code refactoring
#   perf:     Performance improvements
#   test:     Adding or updating tests
#   build:    Build system or dependencies
#   ci:       CI/CD changes
#   chore:    Other changes (maintenance)
#
# Examples:
#   feat(ml): add content recommendation engine
#   fix(auth): resolve JWT token expiration issue
#   docs(readme): update installation instructions
#   refactor(storage): optimize chunk processing
#
# =============================================================================
