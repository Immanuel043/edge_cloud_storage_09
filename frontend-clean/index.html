<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edge Cloud Storage</title>
    <!-- PDF.js for PDF thumbnail generation (ZK encryption) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      // Configure pdf.js worker
      if (window.pdfjsLib) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
    </script>
    <!-- Argon2 for ZK encryption key derivation - loaded via script tag for reliable WASM loading -->
    <script>
      // Set WASM path BEFORE loading argon2-browser.js
      window.argon2WasmPath = '/argon2.wasm';
    </script>
    <script src="/argon2-browser.js"></script>
    <!-- Razorpay Checkout SDK loaded dynamically when needed (see PlanChangeModal) -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
