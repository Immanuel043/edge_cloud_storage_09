# docker-compose-monitoring.yml
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: edge-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    networks:
      - edge-network

  grafana:
    image: grafana/grafana:latest
    container_name: edge-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "127.0.0.1:3030:3000"
    restart: unless-stopped
    networks:
      - edge-network
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: edge-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "127.0.0.1:9100:9100"
    restart: unless-stopped
    networks:
      - edge-network

  # cAdvisor — per-container CPU / memory / network / cgroup metrics.
  # Required for the StorageServiceCFSThrottled alert in alerts.yml, which
  # reads container_cpu_cfs_throttled_seconds_total filtered by the
  # com.docker.compose.service label. The whitelist flag keeps that label;
  # without it cAdvisor strips compose labels and the alert can't filter.
  #
  # NOTE: on Docker Desktop for Mac/Windows, cAdvisor cannot resolve the
  # docker layerdb under /rootfs/var/lib/docker (overlay paths differ inside
  # the LinuxKit VM), so it falls back to the "Raw" factory and exposes only
  # the root cgroup. This is expected — on real Linux prod hosts the docker
  # container factory registers cleanly and per-container metrics appear.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: edge-cadvisor
    command:
      - '--housekeeping_interval=10s'
      - '--docker_only=true'
      - '--store_container_labels=false'
      - '--whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      # Docker Desktop on Mac doesn't expose docker.sock under /var/run; mount
      # it explicitly so the docker container factory can register and we get
      # per-container metrics, not just the root cgroup.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:8090:8080"
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - edge-network

  # Kafka consumer-lag exporter.
  # Scrapes Kafka directly and exposes per-consumer-group lag metrics
  # (kafka_consumergroup_lag, kafka_consumergroup_lag_sum) that Prometheus
  # picks up via the scrape config in ./monitoring/prometheus.yml.
  # This is the missing observability wire identified in the 2026-04
  # architecture review — without it, a stalled worker silently grows
  # backlog forever.
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: edge-kafka-exporter
    command:
      - '--kafka.server=kafka:9092'
      - '--web.listen-address=:9308'
    ports:
      - "127.0.0.1:9308:9308"
    restart: unless-stopped
    networks:
      - edge-network

volumes:
  prometheus_data:
  grafana_data:

networks:
  edge-network:
    external: true
    name: edge-cloud-network