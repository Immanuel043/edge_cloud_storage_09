# infrastructure/monitoring/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Storage Service metrics (from your app/monitoring/metrics.py)
  - job_name: 'storage-service'
    static_configs:
      - targets: ['storage-service:8000']
    metrics_path: '/metrics'
    
  # Web Service metrics
  - job_name: 'web-service'
    static_configs:
      - targets: ['web-service:3001']
    metrics_path: '/metrics'

  # ZK Encryption Service metrics
  - job_name: 'zk-encryption-service'
    static_configs:
      - targets: ['zk-encryption-service:8002']
    metrics_path: '/metrics'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter (system metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor (per-container CFS throttling, cgroup memory, etc.).
  # Required by StorageServiceCFSThrottled alert.
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Kafka consumer-lag exporter (danielqsj/kafka-exporter).
  # Exposes kafka_consumergroup_lag{consumergroup,topic,partition} which
  # the alert in ./alerts.yml uses to catch stuck workers early.
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']

  # Redis metrics (requires redis-exporter container - add when needed)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # PostgreSQL metrics (requires postgres-exporter container - add when needed)
  # - job_name: 'postgresql'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Elasticsearch metrics (requires prometheus-exporter plugin)
  # - job_name: 'elasticsearch'
  #   static_configs:
  #     - targets: ['elasticsearch:9200']
  #   metrics_path: '/_prometheus/metrics'

  # Kafka metrics (requires JMX exporter on port 9404, not broker port 9092)
  # - job_name: 'kafka'
