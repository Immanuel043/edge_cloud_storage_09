# Development override for 8GB Mac
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# This reduces memory limits and disables non-essential services.
# Does NOT modify any code or the production docker-compose.yml.

services:
  postgres:
    # WAL archiving is intentionally OFF in dev: the postgres-backup container
    # that consumes the archive is `profiles: production` and never runs in
    # dev, so archiving is wasted I/O. Worse, prod's archive_command refuses
    # to overwrite — when the data dir gets reset but the wal_archive volume
    # persists, postgres logs WARNING once a minute forever about a stale
    # WAL filename it can't re-archive. archive_mode=off avoids both.
    command: >
      postgres
      -c max_connections=50
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=256MB
      -c wal_level=replica
      -c archive_mode=off
      -c max_wal_senders=5
      -c wal_keep_size=1GB
      -c hot_standby=on
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  zk-postgres:
    command: >
      postgres
      -c max_connections=30
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c maintenance_work_mem=16MB
      -c effective_cache_size=128MB
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  redis:
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M

  elasticsearch:
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M

  # Snapshots are not useful on a laptop; skip in dev.
  es-snapshot-runner:
    profiles:
      - production

  # DB backups not needed on a laptop; skip in dev.
  zk-postgres-backup:
    profiles:
      - production

  postgres-backup:
    profiles:
      - production

  # Disable ClamAV in dev (heavy + slow startup)
  clamav:
    profiles:
      - production

  clickhouse:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  zookeeper:
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  kafka:
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKAJS_NO_PARTITIONER_WARNING: 1
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 24
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  rust-dataplane:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M

  storage-service:
    mem_limit: 2g
    cpus: "2.0"
    # Dev runs a single replica (8GB Mac can't fit two 2G API containers on top
    # of postgres, kafka, ES, redis, etc.). Production keeps the compose
    # default of 2 replicas behind nginx.
    environment:
      # Override prod's WORKER_MODE=api: in dev we skip the separate
      # storage-worker service (see below) and let storage-service run the
      # in-process timers again. This keeps the dev experience identical to
      # pre-worker-split behavior.
      WORKER_MODE: all
      # Triggers `uvicorn --reload` in entrypoint.sh so saving a file in your
      # editor reloads the running server. Only set in dev; prod keeps source
      # baked into the image (see Dockerfile).
      DEV_RELOAD: "true"
      # 8GB Mac headroom: serialize all FFmpeg/transcode work and the preview
      # generation pipeline. Without these the dev replica spawns multiple
      # heavy subprocesses concurrently and triggers event-loop lag spikes.
      MAX_CONCURRENT_PREVIEWS: "1"
      MAX_CONCURRENT_TRANSCODES: "1"
      PREVIEW_GENERATION_CONCURRENCY: "1"
    # Bind-mount the Python source as read-only so the watcher inside the
    # container sees file changes from your host editor.
    volumes:
      - ../services/storage-service/app:/app/app:ro
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Skip separate worker in dev (storage-service runs WORKER_MODE=all)
  storage-worker:
    profiles:
      - production

  zk-encryption-service:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'

  billing-scheduler:
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  zk-billing-scheduler:
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  web-service:
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M

  chunk-processor:
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Disable preview-processor in dev (heavy FFmpeg)
  preview-processor:
    profiles:
      - production

  es-indexer:
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Disable embedding-processor in dev (loads ML model)
  embedding-processor:
    profiles:
      - production

  # Disable file-analysis-processor in dev (loads ViT, BART, OCR models - 4GB)
  file-analysis-processor:
    profiles:
      - production

  nginx:
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
