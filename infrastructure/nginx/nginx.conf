user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 10240;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ============ LOGGING ============
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format json_combined escape=json
    '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log main;

    # ============ SECURITY ============
    server_tokens off;
    client_max_body_size 10m;

    # ============ RATE LIMITING ============
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=download_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=zk_auth_limit:10m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=zk_recovery_limit:10m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    limit_req_status 429;
    limit_conn_status 429;

    # ============ DDOS PROTECTION ============
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    limit_conn conn_limit_per_ip 50;

    # ============ PERFORMANCE ============
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_body_buffer_size 128k;
    client_body_temp_path /tmp/nginx_uploads;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_disable "msie6";

    # ============ HTTP/2 OPTIMIZATIONS ============
    # Enable HTTP/2 server push for preloading resources
    http2_push_preload on;

    # Increase HTTP/2 header size limits for large headers
    http2_max_field_size 16k;
    http2_max_header_size 32k;

    # Preread body for faster HTTP/2 processing
    http2_body_preread_size 128k;

    # HTTP/2 timeout settings
    http2_recv_timeout 30s;
    http2_idle_timeout 180s;

    # ============ MAPS ============
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ============ UPSTREAM ============
    upstream fastapi_upstream {
        server storage-service:8000;
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    upstream zk_service_upstream {
        server zk-encryption-service:8002;
        keepalive 16;
        keepalive_requests 500;
        keepalive_timeout 60s;
    }

    # ============ HTTP SERVER ============
    server {
        listen 80;
        server_name _;

        # ============ SECURITY HEADERS ============
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Zero-Knowledge Recovery endpoints (very strict rate limiting)
        location ~ ^/api/v1/zk/recovery/ {
            limit_req zone=zk_recovery_limit burst=3 nodelay;
            limit_req_log_level warn;

            proxy_pass http://zk_service_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Zero-Knowledge Authentication endpoints (strict rate limiting)
        location ~ ^/api/v1/zk/(register-zk|login-zk|kdf-params) {
            limit_req zone=zk_auth_limit burst=5 nodelay;
            limit_req_log_level warn;

            proxy_pass http://zk_service_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Zero-Knowledge Service (general endpoints)
        location /api/v1/zk/ {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://zk_service_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Allow large uploads for encrypted files
            client_max_body_size 0;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Authentication endpoints (strict rate limiting)
        location ~ ^/api/v1/(auth|login|register|token) {
            limit_req zone=auth_limit burst=10 nodelay;
            limit_req_log_level warn;

            proxy_pass http://fastapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # WebSocket endpoints
        location ~ ^/api/v1/ws {
            proxy_pass http://fastapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
            proxy_buffering off;
            proxy_cache off;
        }

        # Legacy WebSocket route
        location /ws {
            proxy_pass http://fastapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
            proxy_buffering off;
        }

        # Upload endpoints (rate limited, unlimited body size)
        location ~ ^/api/v1/upload/ {
            limit_req zone=upload_limit burst=5 nodelay;

            client_max_body_size 0;
            client_body_timeout 7200s;

            proxy_pass http://fastapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_connect_timeout 300s;
            proxy_send_timeout 7200s;
            proxy_read_timeout 7200s;

            proxy_busy_buffers_size 64k;
            proxy_temp_file_write_size 128k;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
        }

        # Download endpoints (rate limited)
        location ~ ^/api/v1/(files|download)/ {
            limit_req zone=download_limit burst=20 nodelay;

            proxy_pass http://fastapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 8 128k;
        }

        # Regular API calls (general rate limiting)
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://fastapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
        }

        # Static files with caching
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }

            location ~* \.(html)$ {
                expires -1;
                add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
            }
        }

        # X-Accel-Redirect for efficient file serving
        location /internal_protected/ {
            internal;
            alias /app/storage/;
            sendfile on;
            tcp_nopush on;
            tcp_nodelay on;

            add_header Content-Security-Policy "default-src 'none'; script-src 'none'; object-src 'none';" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Block common attack paths
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ============ HTTPS SERVER WITH HTTP/2 ============
    server {
        listen 443 ssl http2;
        server_name _;

        # ============ SSL CERTIFICATES ============
        # Development: Self-signed certificate (default)
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Production: Let's Encrypt (uncomment when ready)
        # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
        # ssl_trusted_certificate /etc/letsencrypt/live/yourdomain.com/chain.pem;

        # ============ SSL CONFIGURATION ============
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # SSL stapling (enable for production with valid cert)
        # ssl_stapling on;
        # ssl_stapling_verify on;

        # ============ SECURITY HEADERS ============
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ============ LOCATIONS (COPIED FROM HTTP SERVER) ============

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Zero-Knowledge Recovery endpoints (very strict rate limiting)
        location ~ ^/api/v1/zk/recovery/ {
            limit_req zone=zk_recovery_limit burst=3 nodelay;
            limit_req_log_level warn;

            proxy_pass http://zk_service_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Zero-Knowledge Authentication endpoints (strict rate limiting)
        location ~ ^/api/v1/zk/(register-zk|login-zk|kdf-params) {
            limit_req zone=zk_auth_limit burst=5 nodelay;
            limit_req_log_level warn;

            proxy_pass http://zk_service_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Zero-Knowledge Service (general endpoints)
        location /api/v1/zk/ {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://zk_service_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Allow large uploads for encrypted files
            client_max_body_size 0;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Authentication endpoints (strict rate limiting)
        location ~ ^/api/v1/(auth|login|register|token) {
            limit_req zone=auth_limit burst=10 nodelay;
            limit_req_log_level warn;

            proxy_pass http://fastapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # WebSocket endpoints
        location ~ ^/api/v1/ws {
            proxy_pass http://fastapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
            proxy_buffering off;
            proxy_cache off;
        }

        # Legacy WebSocket route
        location /ws {
            proxy_pass http://fastapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
            proxy_buffering off;
        }

        # Upload endpoints (rate limited, unlimited body size)
        location ~ ^/api/v1/upload/ {
            limit_req zone=upload_limit burst=5 nodelay;

            client_max_body_size 0;
            client_body_timeout 7200s;

            proxy_pass http://fastapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_connect_timeout 300s;
            proxy_send_timeout 7200s;
            proxy_read_timeout 7200s;

            proxy_busy_buffers_size 64k;
            proxy_temp_file_write_size 128k;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
        }

        # Download endpoints (rate limited) - OPTIMIZED FOR HTTP/2
        location ~ ^/api/v1/(files|download)/ {
            limit_req zone=download_limit burst=20 nodelay;

            proxy_pass http://fastapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # HTTP/2 optimized buffering
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 8 128k;
        }

        # Regular API calls (general rate limiting)
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://fastapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
        }

        # Static files with caching
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }

            location ~* \.(html)$ {
                expires -1;
                add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
            }
        }

        # X-Accel-Redirect for efficient file serving
        location /internal_protected/ {
            internal;
            alias /app/storage/;
            sendfile on;
            tcp_nopush on;
            tcp_nodelay on;

            add_header Content-Security-Policy "default-src 'none'; script-src 'none'; object-src 'none';" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Block common attack paths
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
