x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: edge-postgres
    logging: *default-logging
    # WAL archiving + streaming replication are always on.
    # - wal_level=replica enables logical wal records needed by pg_basebackup /
    #   a hot-standby replica. Cost: ~5% extra WAL volume.
    # - archive_command ships each closed WAL segment to a dedicated volume
    #   (postgres_wal_archive). Combined with the daily encrypted pg_dump
    #   (postgres-backup sidecar), this drops our RPO from 24h → <5min.
    # - hot_standby=on lets the optional postgres-replica service (profile:
    #   replica) serve read-only queries. No effect on the primary itself.
    # The replicator role is seeded by scripts/init-db.sql — it's created only
    # if POSTGRES_REPLICATION_PASSWORD is set, so dev w/o the secret stays
    # identical to before.
    command: >
      postgres
      -c max_connections=200
      -c max_locks_per_transaction=512
      -c shared_buffers=512MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c effective_cache_size=1GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c max_wal_size=2GB
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
      -c max_wal_senders=5
      -c wal_keep_size=1GB
      -c hot_standby=on
    environment:
      POSTGRES_DB: edge_cloud
      POSTGRES_USER: edge_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Presence of this var causes init-replication.sh to create the
      # ``replicator`` role on first boot. Safe to leave blank when no
      # replica is planned.
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-}
      # Setting POSTGRES_HOST_AUTH_METHOD causes the postgres entrypoint to
      # emit ``host replication all all scram-sha-256`` into pg_hba.conf at
      # initdb time — otherwise replication over TCP would be refused.
      # Only effective on first-boot (empty data dir). For an existing
      # deployment, operators must manually append the replication line to
      # pg_hba.conf — see docs/PITR_RUNBOOK.md.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    # ports removed: Postgres only accessible within Docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_wal_archive:/var/lib/postgresql/wal_archive
      - ../scripts/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql
      - ../scripts/init-replication.sh:/docker-entrypoint-initdb.d/20-init-replication.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edge_admin -d edge_cloud"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # PgBouncer — connection pooler in front of the main Postgres.
  #
  # Why: the storage-service app-side pool is configured for 50 base + 100
  # overflow = 150 connections, which alone would consume 75% of Postgres'
  # max_connections=200 before workers, billing, zk-service, or psql debug
  # sessions are counted. Under transaction pooling PgBouncer multiplexes
  # those 150 "client" connections onto just 25 real backend connections.
  #
  # Mode: pool_mode=transaction. Pre-requisites audited (2026-04-10):
  #   - No SET LOCAL / SET SESSION
  #   - No session-scoped pg_advisory_lock (only pg_advisory_xact_lock is safe)
  #   - No LISTEN / NOTIFY
  #   - No cross-statement PREPARE
  # The one temp-table user (dedup_db_batch.py) was switched to ON COMMIT DROP
  # so the table lifetime is explicitly bounded to a single transaction.
  #
  # asyncpg gotcha: asyncpg and the SQLAlchemy asyncpg dialect BOTH create
  # server-side named prepared statements (`__asyncpg_stmt_N__`). Under
  # transaction pooling, the backend serving a client's prepare can be
  # different from the one serving its execute — so naive transaction
  # pooling breaks prepared statements outright.
  #
  # Fix: PgBouncer 1.21+ has built-in prepared-statement tracking. Set
  # `max_prepared_statements > 0` and PgBouncer caches each prepare and
  # automatically re-deploys it on whichever backend serves the next
  # request for that client. App-side we STILL keep statement_cache_size=0
  # + prepared_statement_cache_size=0 + prepared_statement_name_func=uuid
  # in app/database.py so names are unique across clients (avoids cache
  # thrash) and neither layer caches the prepared statement objects
  # themselves across transactions.
  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    container_name: edge-pgbouncer
    logging: *default-logging
    environment:
      # Target Postgres (resolved via docker-compose service DNS).
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: edge_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: edge_cloud
      # Pooling config. Transaction mode is the whole point — see header.
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      MAX_CLIENT_CONN: 500
      # scram-sha-256 matches Postgres 15's default password hashing.
      AUTH_TYPE: scram-sha-256
      # Close server conns idle for > 10 min so Postgres can reclaim them.
      SERVER_IDLE_TIMEOUT: 600
      # PgBouncer 1.21+ transparently tracks prepared statements per client
      # and re-deploys them onto whichever backend serves the next query
      # — this is what makes asyncpg viable under transaction pooling.
      # 500 slots per client is ample headroom; each slot is a few KB of
      # pgbouncer memory.
      MAX_PREPARED_STATEMENTS: 500
      # With prepared-statement tracking enabled, DISCARD ALL would wipe
      # the statements PgBouncer just tracked. Leave unset (default "")
      # so the pooler does not interfere.
      # Admin console (stats/pause/reconfig). Bound to the docker network
      # only; not exposed to the host.
      ADMIN_USERS: edge_admin
    # ports removed: PgBouncer only accessible within Docker network.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # ``pgbouncer`` image ships with psql-style client. Hit the admin
      # pseudo-db which always responds once the pooler is accepting
      # connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U edge_admin -d edge_cloud"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Read replica for ``postgres``. Streaming, hot standby, read-only.
  #
  # Opt-in: gated behind ``profiles: [replica]`` — ``docker compose up`` does
  # not start it by default. Enable with ``docker compose --profile replica up``.
  #
  # Bootstrap: on first boot the data volume is empty, so we run pg_basebackup
  # against the primary to clone the current state + stream WAL. Requires
  # POSTGRES_REPLICATION_PASSWORD to be set and the ``replicator`` role to
  # exist on the primary (seeded by scripts/init-replication.sh at primary
  # first-boot, or manually via docs/PITR_RUNBOOK.md for existing deployments).
  # On subsequent boots we exec postgres directly on the existing data dir.
  postgres-replica:
    image: postgres:15-alpine
    container_name: edge-postgres-replica
    logging: *default-logging
    profiles:
      - replica
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: edge_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: edge_cloud
      PGPASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-}
    command: >
      bash -c '
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo "[replica] empty data dir — bootstrapping via pg_basebackup from primary"
          pg_basebackup -h postgres -U replicator -D /var/lib/postgresql/data -P -R -X stream -w
          chown -R postgres:postgres /var/lib/postgresql/data
          chmod 0700 /var/lib/postgresql/data
        fi
        exec gosu postgres postgres -c hot_standby=on
      '
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edge_admin -d edge_cloud"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ZK PostgreSQL Database (SEPARATE from Storage Service)
  zk-postgres:
    image: postgres:15-alpine
    container_name: edge-zk-postgres
    logging: *default-logging
    environment:
      POSTGRES_DB: zk_db
      POSTGRES_USER: zk_admin
      POSTGRES_PASSWORD: ${ZK_POSTGRES_PASSWORD}
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=512MB
    # ports removed: ZK Postgres only accessible within Docker network
    volumes:
      - zk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zk_admin -d zk_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: edge-redis
    logging: *default-logging
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    # ports removed: Redis only accessible within Docker network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2.5G
        reservations:
          memory: 512M

  # Elasticsearch for Search & Analytics
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: edge-elasticsearch
    logging: *default-logging
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # Heap sized for production. 768m was below the minimum for ES 8.x with
      # non-trivial indices and caused cold-query latency. Dev override pins
      # this to 256m for local laptops — see docker-compose.dev.yml.
      - "ES_JAVA_OPTS=-Xms1536m -Xmx1536m"
      # Reserve space for snapshots (mounted below). Registered as a repo by
      # the es-snapshot-setup sidecar.
      - "path.repo=/es-snapshots"
    # ports removed: ES only accessible within Docker network (no auth enabled)
    volumes:
      - elasticsearch_snapshots:/es-snapshots
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # Give ES 2 minutes to start before healthchecks count
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G  # 2x heap for native memory + Lucene off-heap + overhead
        reservations:
          memory: 2G

  # Elasticsearch daily snapshot runner.
  # Registers the `daily` snapshot repository at startup (idempotent) and then
  # creates a snapshot every 24 hours. Snapshots live on the
  # `elasticsearch_snapshots` volume — mount it to an off-host location
  # (NFS, sshfs, object-storage fuse) in production for real durability.
  es-snapshot-runner:
    image: curlimages/curl:8.8.0
    container_name: edge-es-snapshot-runner
    logging: *default-logging
    depends_on:
      elasticsearch:
        condition: service_healthy
    # Runs as a loop. Registers repo once, then snapshots every 24h.
    # Snapshot names include a timestamp so they never collide.
    # `wait_for_completion=false` keeps this container lightweight.
    # NOTE: $$ escapes variable interpolation by docker-compose so the shell
    # sees the literal $ signs at runtime.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        ES=http://elasticsearch:9200
        REPO=daily
        echo "[snapshot-runner] registering repo $$REPO"
        until curl -fsS -XPUT "$$ES/_snapshot/$$REPO" \
              -H 'Content-Type: application/json' \
              -d '{"type":"fs","settings":{"location":"/es-snapshots","compress":true}}'; do
          echo "[snapshot-runner] ES not ready, retrying in 10s"
          sleep 10
        done
        echo
        echo "[snapshot-runner] repo registered; entering daily loop"
        while true; do
          NAME="snap-$$(date -u +%Y%m%d-%H%M%S)"
          echo "[snapshot-runner] creating snapshot $$NAME"
          curl -fsS -XPUT "$$ES/_snapshot/$$REPO/$$NAME?wait_for_completion=false" \
            -H 'Content-Type: application/json' \
            -d '{"ignore_unavailable":true,"include_global_state":false}' || \
            echo "[snapshot-runner] snapshot request failed, will retry tomorrow"
          echo
          sleep 86400
        done
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M

  # ZK-Postgres Encrypted Backup (daily pg_dump → openssl AES-256)
  # Contains irreplaceable key material — FIDO2, BIP39, envelope keys
  zk-postgres-backup:
    image: postgres:15-alpine
    container_name: edge-zk-postgres-backup
    logging: *default-logging
    depends_on:
      zk-postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "[zk-backup] waiting 60s for database to stabilize"
        sleep 60
        while true; do
          /scripts/pg-backup.sh || echo "[zk-backup] backup failed, will retry tomorrow"
          sleep 86400
        done
    environment:
      DB_HOST: zk-postgres
      DB_PORT: "5432"
      DB_USER: zk_admin
      DB_PASSWORD: ${ZK_POSTGRES_PASSWORD}
      DB_NAME: zk_db
      BACKUP_DIR: /backups
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      RETENTION_DAYS: "30"
      LABEL: zk-postgres
    volumes:
      - zk_postgres_backups:/backups
      - ../scripts/pg-backup.sh:/scripts/pg-backup.sh:ro
      - ../scripts/pg-restore.sh:/scripts/pg-restore.sh:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Main Postgres Encrypted Backup (daily pg_dump → openssl AES-256)
  postgres-backup:
    image: postgres:15-alpine
    container_name: edge-postgres-backup
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "[pg-backup] waiting 60s for database to stabilize"
        sleep 60
        while true; do
          /scripts/pg-backup.sh || echo "[pg-backup] backup failed, will retry tomorrow"
          sleep 86400
        done
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: edge_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: edge_cloud
      BACKUP_DIR: /backups
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      RETENTION_DAYS: "30"
      LABEL: main-postgres
    volumes:
      - postgres_backups:/backups
      - ../scripts/pg-backup.sh:/scripts/pg-backup.sh:ro
      - ../scripts/pg-restore.sh:/scripts/pg-restore.sh:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # ClamAV Antivirus Scanner
  clamav:
    image: clamav/clamav:latest
    container_name: edge-clamav
    logging: *default-logging
    # ports removed: ClamAV only accessible within Docker network
    volumes:
      - clamav_data:/var/lib/clamav
    environment:
      - CLAMAV_NO_FRESHCLAM=false
    healthcheck:
      test: ["CMD", "sh", "-c", "[ -S /tmp/clamd.sock ] || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s  # Takes ~5 minutes to download virus definitions on first start
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G  # ClamAV needs significant memory for virus databases
        reservations:
          memory: 1G

  # ClickHouse for Analytics
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: edge-clickhouse
    logging: *default-logging
    # ports removed: ClickHouse only accessible within Docker network
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: edge-zookeeper
    logging: *default-logging
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: edge-kafka
    logging: *default-logging
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
      KAFKAJS_NO_PARTITIONER_WARNING: 1
      KAFKA_HEAP_OPTS: "-Xmx768m -Xms512m"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 10737418240
      KAFKA_LOG_SEGMENT_BYTES: 104857600
    # ports removed: Kafka only accessible within Docker network
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Rust Data Plane Service
  rust-dataplane:
    build:
      context: ../
      dockerfile: services/rust-data-plane/Dockerfile
    container_name: edge-rust-dataplane
    logging: *default-logging
    environment:
      RUST_LOG: info
      STORAGE_ROOT: /app/storage
      SOCKET_PATH: /run/dataplane/edge-storage-dataplane.sock
      USE_SCM_RIGHTS: "true"
      COMPRESSION_LEVEL: 3
    volumes:
      # Shared socket volume with storage-service
      - dataplane-socket:/run/dataplane
      # Shared storage for chunk files (same path as storage-service)
      - storage_data:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/dataplane/edge-storage-dataplane.sock"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M

  # Storage Service (FastAPI) - THE MAIN FIX
  # Multi-replica capable: container_name + host port binding intentionally
  # removed so `deploy.replicas > 1` works. nginx load-balances via Docker DNS
  # (see fastapi_upstream/ws_upstream in nginx.conf). Timers and background
  # consumers live in the `storage-worker` service (scale=1) — this container
  # runs in WORKER_MODE=api.
  storage-service:
    build:
      context: ../
      dockerfile: services/storage-service/Dockerfile
    logging: *default-logging
    env_file:
      - .env # Load environment variables from .env file
    cap_add:
      - IPC_LOCK  # Required for memfd_create syscall
    security_opt:
      # Required for Rust data plane integration (memfd_create, SCM_RIGHTS fd passing).
      # TODO: Replace with a custom seccomp profile allowing only needed syscalls:
      #   memfd_create, sendmsg, recvmsg, mmap, munmap, and standard I/O syscalls.
      - seccomp:unconfined

    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rust-dataplane:
        condition: service_healthy
      # clamav:
      #   condition: service_healthy  # Disabled for ARM Mac compatibility
    environment:
      # API-only: background timers run in storage-worker (see `combined_worker`)
      WORKER_MODE: api
      DB_HOST: postgres
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      KAFKA_BROKERS: kafka:9092
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      STORAGE_ROOT: /app/storage
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      # Database initialization mode
      USE_FRESH_DB_INIT: ${USE_FRESH_DB_INIT:-false}
      FORCE_RECREATE: ${FORCE_RECREATE:-false}
      SKIP_SEED: ${SKIP_SEED:-false}
      # CRITICAL: Reduce chunk size for memory management
      CHUNK_SIZE: 33554432          # 32MB chunks instead of 64MB
      MAX_FILE_SIZE: 214748364800   # 200GB
      COMPRESSION_LEVEL: 3
      BACKUP_ENABLED: "false"
      USE_X_ACCEL: "1"
      # Add memory management settings
      PYTHONMALLOC: malloc
      MALLOC_TRIM_THRESHOLD: 131072   # fixed env var name (no trailing underscore)

      # Rust data plane integration (convergent encryption for dedup)
      RUST_DATAPLANE_ENABLED: "true"
      RUST_DATAPLANE_SOCKET: /run/dataplane/edge-storage-dataplane.sock

      # Bandwidth throttle (token-bucket only; stream-slot limits always active)
      # Set to "false" for local dev to skip rate-limit sleeps
      BANDWIDTH_THROTTLE_ENABLED: "${BANDWIDTH_THROTTLE_ENABLED:-true}"

      # Frontend URL for CSP headers
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      
      # Payment Gateway Configuration
      # Razorpay
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_ENABLED: ${RAZORPAY_ENABLED:-true}
      RAZORPAY_CURRENCY: ${RAZORPAY_CURRENCY:-INR}
      
      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_ENABLED: ${STRIPE_ENABLED:-true}
      
      # Payment URLs
      PAYMENT_SUCCESS_URL: ${PAYMENT_SUCCESS_URL:-http://localhost:3000/billing/success}
      PAYMENT_FAILURE_URL: ${PAYMENT_FAILURE_URL:-http://localhost:3000/billing/failure}
      DEFAULT_PAYMENT_GATEWAY: ${DEFAULT_PAYMENT_GATEWAY:-razorpay}
      
      # Development Mode
      DEV_MODE: ${DEV_MODE:-false}

      # Mailgun Configuration (Email Verification)
      MAILGUN_ENABLED: ${MAILGUN_ENABLED:-true}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      MAILGUN_FROM_EMAIL: ${MAILGUN_FROM_EMAIL:-noreply@yourdomain.com}
      MAILGUN_FROM_NAME: ${MAILGUN_FROM_NAME:-Edge Cloud Storage}

      # Company / Invoice Branding
      COMPANY_NAME: ${COMPANY_NAME:-Edge Cloud Storage}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-}
      COMPANY_EMAIL: ${COMPANY_EMAIL:-}
      COMPANY_PHONE: ${COMPANY_PHONE:-}
      COMPANY_GST: ${COMPANY_GST:-}
      COMPANY_LOGO_URL: ${COMPANY_LOGO_URL:-}

      # Video Transcoding Configuration
      ENABLE_SMART_TRANSCODE: "true"
      ENABLE_REMUX_OPTIMIZATION: "true"     # Fast copy for H.264+AAC in MOV containers (2-5s vs 8-12min)
      ENABLE_STREAMING_DECRYPT: "false"  # Feature flag for streaming (default off)
      TRANSCODE_MAX_DURATION_MINUTES: "30"
      TRANSCODE_MAX_SIZE_GB: "2"
      TRANSCODE_TIER1_MAX_SIZE_MB: "100"    # veryfast, CRF 23
      TRANSCODE_TIER2_MAX_SIZE_MB: "1000"   # fast, CRF 24
      TRANSCODE_TIER3_PRESET: "ultrafast"   # CRF 25 for >1GB
      MAX_CONCURRENT_TRANSCODES: "2"
      TRANSCODE_QUEUE_MAX_SIZE: "5"

    # NOTE: no host port binding — replicas would collide on 127.0.0.1:8001.
    # Access storage-service through nginx (https://localhost) or `docker
    # compose exec`. If you need direct local access for debugging, add a
    # one-off `ports:` block in a docker-compose.override.yml (never here).
    expose:
      - "8000"
    volumes:
     - storage_data:/app/storage
      # Cold tier on a separate volume so prod can back it with cheaper
      # storage (see docker-compose volumes: cold_storage_data).
     - cold_storage_data:/app/storage/cold
      # Add temp directory with size limit
     - /tmp/upload_temp:/tmp/upload_temp
      # Shared socket volume with rust-dataplane for full mode
     - dataplane-socket:/run/dataplane
    # Local docker-compose resource limits (works with many compose setups)
    mem_limit: 8g
    cpus: "4.0"
    # CRITICAL: Add resource limits for Swarm (only used when using `docker stack deploy`)
    deploy:
      # Default to 2 replicas. In dev we pin this back to 1 via
      # docker-compose.dev.yml (8GB Mac can't fit two 8G API containers).
      # Scale further in prod with `docker compose up -d --scale storage-service=N`.
      replicas: 2
      resources:
        limits:
          memory: 8G              # Allow up to 8GB for 100 concurrent uploads
          cpus: '4.0'             # More CPU for parallel processing
        reservations:
          memory: 2G              # Reserve 2GB
          cpus: '1.0'
    # (removed invalid top-level memswap_limit — configure swap at daemon or use docker run flags)
    # Better, simpler healthcheck (curl is more reliable & lighter weight)
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    # Add ulimits for file handling
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # Combined Background Worker (extractable workers from storage-service)
  # Runs quota prediction, storage optimization, orphan cleanup, video processing
  # in a dedicated container, separate from the API event loop.
  storage-worker:
    build:
      context: ../
      dockerfile: services/storage-service/Dockerfile
    container_name: edge-storage-worker
    logging: *default-logging
    env_file:
      - .env
    entrypoint: []
    command: ["python", "-m", "app.workers.combined_worker"]
    environment:
      WORKER_MODE: worker
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BROKERS: kafka:9092
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ELASTICSEARCH_URL: http://elasticsearch:9200
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      STORAGE_ROOT: /app/storage
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      storage-service:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage
      # Match storage-service's cold-tier volume so the worker reads/writes
      # the same backing store during tier migrations.
      - cold_storage_data:/app/storage/cold
      - dataplane-socket:/run/dataplane
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'combined_worker' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Zero-Knowledge Encryption Service (FastAPI)
  # IMPORTANT: Uses SEPARATE database from Storage Service
  zk-encryption-service:
    build:
      context: ../
      dockerfile: services/zk-encryption-service/Dockerfile
    container_name: edge-zk-service
    logging: *default-logging
    env_file:
      - .env
    depends_on:
      zk-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # SEPARATE DATABASE from Storage Service
      ZK_DATABASE_URL: ${ZK_DATABASE_URL}
      ZK_REDIS_URL: ${ZK_REDIS_URL}
      # ZK-specific storage path - isolated from normal storage
      ZK_STORAGE_PATH: /app/storage/zk
      # Separate secret key for ZK auth
      ZK_SECRET_KEY: ${ZK_SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
      # ZK-specific settings
      ZK_SERVICE_PORT: 8002
      RP_ID: ${RP_ID:-localhost}
      RP_NAME: ${RP_NAME:-EdgeCloud Private Vault}
      RP_ORIGIN: ${RP_ORIGIN:-https://localhost}
      # Security settings
      PBKDF2_ITERATIONS: 600000
      MAX_RECOVERY_ATTEMPTS: 5
      MAX_HARDWARE_KEYS_PER_USER: 5
      
      # Payment Gateway Configuration
      # Razorpay
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_ENABLED: ${RAZORPAY_ENABLED:-true}
      RAZORPAY_CURRENCY: ${RAZORPAY_CURRENCY:-INR}
      
      # Stripe
      ZK_STRIPE_SECRET_KEY: ${ZK_STRIPE_SECRET_KEY:-}
      ZK_STRIPE_PUBLISHABLE_KEY: ${ZK_STRIPE_PUBLISHABLE_KEY:-}
      ZK_STRIPE_WEBHOOK_SECRET: ${ZK_STRIPE_WEBHOOK_SECRET:-}
      STRIPE_ENABLED: ${STRIPE_ENABLED:-true}
      
      # Payment URLs
      PAYMENT_SUCCESS_URL: ${PAYMENT_SUCCESS_URL:-http://localhost:3000/billing/success}
      PAYMENT_FAILURE_URL: ${PAYMENT_FAILURE_URL:-http://localhost:3000/billing/failure}
      DEFAULT_PAYMENT_GATEWAY: ${DEFAULT_PAYMENT_GATEWAY:-razorpay}
      
      # Development Mode
      DEV_MODE: ${DEV_MODE:-false}
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_REQUESTS_PER_MINUTE: 60

      # Mailgun Configuration (Email Verification)
      MAILGUN_ENABLED: ${MAILGUN_ENABLED:-true}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      MAILGUN_FROM_EMAIL: ${MAILGUN_FROM_EMAIL:-noreply@yourdomain.com}
      MAILGUN_FROM_NAME: ${MAILGUN_FROM_NAME:-Edge Cloud ZK Storage}

      # Company / Invoice Branding
      COMPANY_NAME: ${COMPANY_NAME:-Edge Cloud ZK Storage}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-}
      COMPANY_EMAIL: ${COMPANY_EMAIL:-}
      COMPANY_PHONE: ${COMPANY_PHONE:-}
      COMPANY_GST: ${COMPANY_GST:-}
      COMPANY_LOGO_URL: ${COMPANY_LOGO_URL:-}

      # Cookie security (false for HTTP development, true for HTTPS production)
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # CORS origins for ZK frontend
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001","http://localhost:5173","http://127.0.0.1:3000","http://127.0.0.1:3001","http://127.0.0.1:5173"]'
      # Logging
      LOG_LEVEL: INFO
      DEBUG: ${DEBUG:-false}
      ENABLE_METRICS: "true"
      ENABLE_AUDIT_LOGGING: "true"
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - storage_data:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Billing Notification Scheduler for Normal Storage
  billing-scheduler:
    build:
      context: ../
      dockerfile: services/storage-service/Dockerfile
    container_name: edge-billing-scheduler
    logging: *default-logging
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-service:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}

      # Mailgun Configuration (for sending notification emails)
      MAILGUN_ENABLED: ${MAILGUN_ENABLED:-true}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      MAILGUN_FROM_EMAIL: ${MAILGUN_FROM_EMAIL:-noreply@yourdomain.com}
      MAILGUN_FROM_NAME: ${MAILGUN_FROM_NAME:-Edge Cloud Storage}

      # Logging
      LOG_LEVEL: INFO
    entrypoint: ["python", "-m", "app.scheduler"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python -m app.scheduler' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  # Billing Notification Scheduler for ZK Service
  zk-billing-scheduler:
    build:
      context: ../
      dockerfile: services/zk-encryption-service/Dockerfile
    container_name: edge-zk-billing-scheduler
    logging: *default-logging
    env_file:
      - .env
    depends_on:
      zk-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      zk-encryption-service:
        condition: service_healthy
    environment:
      # SEPARATE DATABASE from Storage Service
      ZK_DATABASE_URL: ${ZK_DATABASE_URL}
      ZK_REDIS_URL: ${ZK_REDIS_URL}
      ZK_SECRET_KEY: ${ZK_SECRET_KEY}

      # Mailgun Configuration (for sending notification emails)
      MAILGUN_ENABLED: ${MAILGUN_ENABLED:-true}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      MAILGUN_FROM_EMAIL: ${MAILGUN_FROM_EMAIL:-noreply@yourdomain.com}
      MAILGUN_FROM_NAME: ${MAILGUN_FROM_NAME:-Edge Cloud ZK Storage}

      # Logging
      LOG_LEVEL: INFO
    entrypoint: ["python", "-m", "app.scheduler"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python -m app.scheduler' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  # Web Service (Node.js)
  web-service:
    build:
      context: ../services/web-service
      dockerfile: Dockerfile
    container_name: edge-web-service
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      storage-service:
        condition: service_healthy
      zk-encryption-service:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: ${WEB_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BROKERS: kafka:9092
      STORAGE_SERVICE_URL: http://storage-service:8000
      SESSION_SECRET: ${SESSION_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      KAFKAJS_NO_PARTITIONER_WARNING: 1
    # ports removed: web-service only accessible via Nginx reverse proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s  # Increased: depends on storage-service & zk-service which need time
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  chunk-processor:
    build:
      context: ..
      dockerfile: services/storage-service/Dockerfile
    logging: *default-logging
    env_file:
      - .env
    entrypoint: []
    command: ["python", "-m", "app.workers.chunk_processor"]
    deploy:
      replicas: 2              # Reduce replicas to save memory
      resources:
        limits:
          memory: 1G           # Limit each processor
        reservations:
          memory: 256M
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BROKERS: kafka:9092
      CHUNK_SIZE: 33554432     # Same 32MB chunk size
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    volumes:
      - /tmp/chunks:/tmp/chunks
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'chunk_processor' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Preview Processor Worker - Background video preview generation
  preview-processor:
    build:
      context: ..
      dockerfile: services/storage-service/Dockerfile
    logging: *default-logging
    env_file:
      - .env
    entrypoint: []
    command: ["python", "-m", "app.workers.preview_worker"]
    deploy:
      replicas: 2              # 2 workers for parallel preview generation
      resources:
        limits:
          memory: 2G           # Higher limit for FFmpeg processing
        reservations:
          memory: 512M
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BROKERS: kafka:9092
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAX_CONCURRENT_PREVIEWS: 2  # Limit concurrent FFmpeg processes per worker
      STORAGE_ROOT: /app/storage
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      RUST_DATAPLANE_SOCKET: /run/dataplane/edge-storage-dataplane.sock
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      storage-service:
        condition: service_healthy
      rust-dataplane:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage
      - cold_storage_data:/app/storage/cold
      - /tmp/preview_temp:/tmp/preview_temp
      - dataplane-socket:/run/dataplane
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'preview_worker' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ES Indexing Worker - Background Elasticsearch indexing via Kafka
  es-indexer:
    build:
      context: ..
      dockerfile: services/storage-service/Dockerfile
    logging: *default-logging
    env_file:
      - .env
    entrypoint: []
    command: ["python", "-m", "app.workers.es_indexing_worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BROKERS: kafka:9092
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-true}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'es_indexing_worker' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Embedding Processor Worker - Background semantic embedding generation
  embedding-processor:
    build:
      context: ..
      dockerfile: services/storage-service/Dockerfile
    logging: *default-logging
    env_file:
      - .env
    entrypoint: []
    command: ["python", "-m", "app.workers.embedding_worker"]
    deploy:
      replicas: 1              # 1 worker is enough for embeddings (model is single-threaded)
      resources:
        limits:
          memory: 2G           # Memory for sentence-transformers model
        reservations:
          memory: 1G
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BROKERS: kafka:9092
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SEMANTIC_SEARCH_ENABLED: "true"
      SEMANTIC_MODEL_NAME: all-MiniLM-L6-v2
      EMBEDDING_BATCH_SIZE: 10
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage
      - cold_storage_data:/app/storage/cold
      - /tmp/embedding_temp:/tmp/embedding_temp
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'embedding_worker' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # File Analysis Processor Worker - Background AI tagging, OCR, metadata extraction
  file-analysis-processor:
    build:
      context: ..
      dockerfile: services/storage-service/Dockerfile
    logging: *default-logging
    env_file:
      - .env
    entrypoint: []
    command: ["python", "-m", "app.workers.file_analysis_worker"]
    deploy:
      replicas: 1              # 1 worker for AI analysis (GPU-bound if available)
      resources:
        limits:
          memory: 4G           # Higher memory for ViT, BART, OCR models
        reservations:
          memory: 2G
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BROKERS: kafka:9092
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      STORAGE_ROOT: /app/storage
      ML_FEATURES_ENABLED: "true"
      # AI Analysis settings
      AI_TAGGING_ENABLED: "true"
      OCR_ENABLED: "true"
      METADATA_EXTRACTION_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      storage-service:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage
      - cold_storage_data:/app/storage/cold
      - /tmp/file_analysis_temp:/tmp/file_analysis_temp
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'file_analysis_worker' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Nginx reverse-proxy
  nginx:
    image: nginx:stable
    container_name: edge-nginx
    logging: *default-logging
    depends_on:
      storage-service:
        condition: service_healthy
      web-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - storage_data:/app/storage:ro
      # Create temp directory for uploads
      - /tmp/nginx_uploads:/tmp/nginx_uploads
      # SSL certificates (uncomment based on your setup)
      # For self-signed certificates:
      - ./ssl:/etc/nginx/ssl:ro
      # For Let's Encrypt certificates:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      # Logs
      - ./logs/nginx:/var/log/nginx
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - default

  # Certbot for Let's Encrypt SSL certificates (optional)
  certbot:
    image: certbot/certbot:latest
    container_name: edge-certbot
    logging: *default-logging
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    profiles:
      - production  # Only run in production (use: docker-compose --profile production up)
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    networks:
      - default

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
  zk_postgres_data:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local
  clamav_data:
    driver: local
  clickhouse_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
  kafka_data:
    driver: local
  storage_data:
    driver: local
  dataplane-socket:
    driver: local
  elasticsearch_snapshots:
    driver: local
  zk_postgres_backups:
    driver: local
  postgres_backups:
    driver: local
  # WAL archive for PITR — receives closed WAL segments from the primary.
  # See postgres.command (archive_command) and docs/PITR_RUNBOOK.md.
  postgres_wal_archive:
    driver: local
  # Data dir for the optional postgres-replica service (profile: replica).
  postgres_replica_data:
    driver: local
  # Cold-tier backing volume — mounted at /app/storage/cold on storage
  # services. Split out from storage_data so operators can swap the backing
  # device (slow HDD, S3 FUSE, NFS) via `driver_opts` or an external volume
  # without touching the hot cache/warm path. Default local driver matches
  # storage_data behavior for dev; repoint in prod for cost savings.
  cold_storage_data:
    driver: local

# Networks
networks:
  default:
    name: edge-cloud-network
    driver: bridge
