[package]
name = "edge-storage-dataplane"
version = "0.1.0"
edition = "2021"
authors = ["Edge Storage Team"]
description = "High-performance Rust data plane for storage operations"
license = "MIT"

[[bin]]
name = "edge-storage-dataplane"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }

# HTTP server over Unix Domain Socket
hyper = { version = "1.5", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
http-body-util = "0.1"

# Cryptography (ring for hardware AES-NI acceleration)
ring = "0.17"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"

# Compression
zstd = { version = "0.13", features = ["zstdmt"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "ansi"] }

# Prometheus metrics
prometheus = { version = "0.13", features = ["process"] }
lazy_static = "1.5"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Memory management
bytes = "1.7"
memmap2 = "0.9"
parking_lot = "0.12"

# Configuration
toml = "0.8"

# Utilities
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = "0.4"
fs2 = "0.4"
scopeguard = "1.2"

# Platform-specific (Linux only)
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["socket", "uio", "fs"] }

# macOS support for memfd (via shm_open)
[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.29", features = ["socket", "uio", "fs", "mman"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
tempfile = "3.12"
tokio-test = "0.4"

[profile.release]
lto = "fat"              # Link-time optimization for smaller binary
codegen-units = 1        # Better optimization, slower compile
opt-level = 3            # Maximum optimization
panic = "abort"          # No unwinding for smaller binary
strip = true             # Strip symbols for smaller binary

[profile.dev]
opt-level = 0            # No optimization for faster builds
debug = true

[profile.bench]
inherits = "release"
debug = true
