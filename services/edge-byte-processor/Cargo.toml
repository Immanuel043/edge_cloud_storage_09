[package]
name = "edge-byte-processor"
version = "0.1.0"
edition = "2021"
description = "High-performance cdylib for CDC chunking, batch SHA-256, and bloom filter"

[lib]
crate-type = ["cdylib"]

[dependencies]
ring = "0.17"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
